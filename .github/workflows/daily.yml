name: Daily Puzzle Fetch & Benchmark

on:
  schedule:
    # Run at 07:00 UTC daily so README can include a predictive entry for today
    - cron: 0 7 * * *
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  fetch-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: npm ci

      - name: Fetch latest puzzles & stats
        run: npm run fetch

      - name: Run benchmark & update README
        run: npm run benchmark

      - name: Write daily run summary
        run: npm run daily-summary

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ README.md
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "chore: daily puzzle fetch & benchmark update"
          git push
